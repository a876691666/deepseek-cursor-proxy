name: Release

# Build cross-platform binaries on tag push or manual trigger,
# then create a GitHub Release with all artifacts and push a
# multi-arch Docker image to GHCR.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: "Build (${{ matrix.goos }}/${{ matrix.goarch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64,  ext: .exe }
          - { goos: windows, goarch: arm64,  ext: .exe }
          - { goos: linux,   goarch: amd64,  ext: ""    }
          - { goos: linux,   goarch: arm64,  ext: ""    }
          - { goos: darwin,  goarch: amd64,  ext: ""    }
          - { goos: darwin,  goarch: arm64,  ext: ""    }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Build binary
        env:
          GOOS: "${{ matrix.goos }}"
          GOARCH: "${{ matrix.goarch }}"
        run: |
          BINARY="deepseek-cursor-proxy-${GOOS}-${GOARCH}${{ matrix.ext }}"
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${BINARY}" ./cmd/deepseek-cursor-proxy/
          echo "binary=${BINARY}" >> "$GITHUB_ENV"

      - name: Build Docker image tarball (linux only)
        if: matrix.goos == 'linux'
        run: |
          cat > Dockerfile.tar <<'DOCKERFILE'
          FROM alpine:latest
          RUN apk add --no-cache ca-certificates tzdata && \
              addgroup -S app && adduser -S -G app app
          COPY binary /usr/local/bin/deepseek-cursor-proxy
          USER app
          EXPOSE 9000
          HEALTHCHECK --interval=30s --timeout=5s --start-period=5s --retries=3 \
              CMD wget -qO- http://127.0.0.1:9000/healthz >/dev/null 2>&1 || exit 1
          CMD ["/usr/local/bin/deepseek-cursor-proxy", "serve"]
          DOCKERFILE
          cp "${{ env.binary }}" binary
          IMAGE_TAG="deepseek-cursor-proxy:${{ matrix.goarch }}"
          docker build -f Dockerfile.tar -t "${IMAGE_TAG}" .
          TARBALL="deepseek-cursor-proxy-docker-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          docker save "${IMAGE_TAG}" | gzip > "${TARBALL}"
          echo "tarball=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.binary }}"
          path: "${{ env.binary }}"

      - name: Upload Docker tarball artifact (linux only)
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.tarball }}"
          path: "${{ env.tarball }}"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show dist
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  docker:
    name: Push multi-arch Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
